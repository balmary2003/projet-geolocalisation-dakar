<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Restaurants de Dakar — Suivi en temps réel</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #16241F;
            --sand: #F1E9D8;
            --sand-2: #E7DBC2;
            --paprika: #BF4E26;
            --teal: #1F6E5C;
            --gold: #E3A72E;
            --white: #FFFDF8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--sand);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, .brand, .card-name, .popup-title {
            font-family: 'Fraunces', serif;
        }

        header {
            background: var(--ink);
            color: var(--sand);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .brand span { color: var(--gold); }

        .auth-box {
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .auth-box a {
            color: var(--sand);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 1px;
        }

        .btn-logout {
            background: var(--paprika);
            color: var(--white);
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.84rem;
            font-weight: 600;
        }

        .btn-logout:hover { background: #A5401E; }

        .map-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
        }

        #mapid { height: 100%; width: 100%; }

        .control-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1000;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(22,36,31,0.18);
            padding: 16px;
            width: 260px;
            max-width: 88vw;
            border: 1px solid var(--sand-2);
        }

        .control-panel h3 {
            font-family: 'Fraunces', serif;
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--ink);
        }

        .control-panel input,
        .control-panel select {
            width: 100%;
            padding: 9px 10px;
            margin-bottom: 8px;
            border: 1px solid var(--sand-2);
            border-radius: 7px;
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            background: var(--sand);
            color: var(--ink);
        }

        .control-panel input:focus,
        .control-panel select:focus {
            outline: 2px solid var(--teal);
            outline-offset: 1px;
        }

        .btn-row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }

        .control-panel button {
            flex: 1;
            padding: 9px 6px;
            border: none;
            border-radius: 7px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .control-panel button:hover { opacity: 0.87; }
        .control-panel button:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-primary { background: var(--paprika); color: var(--white); }
        .btn-secondary { background: var(--sand-2); color: var(--ink); }
        .btn-accent { background: var(--teal); color: var(--white); }
        .btn-track { background: var(--ink); color: var(--sand); }
        .btn-stop { background: #8C3226; color: var(--white); }

        .panel-toggle {
            position: absolute;
            top: 20px;
            left: 16px;
            z-index: 1100;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--paprika);
            color: var(--white);
            border: 2px solid var(--white);
            font-size: 1.25rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(22,36,31,0.35);
            display: none;
        }

        @media (max-width: 680px) {
            .panel-toggle { display: block; }

            .control-panel {
                top: 70px;
                left: 16px;
                right: 16px;
                width: auto;
                max-width: none;
                display: none;
            }
            .control-panel.open { display: block; }

            header { padding: 10px 14px; }
            .brand { font-size: 0.95rem; }
            .auth-box { font-size: 0.8rem; }

            .control-panel button {
                padding: 11px 6px;
                font-size: 0.82rem;
            }

            .resto-card { width: 155px; padding: 10px; }
            .card-name { font-size: 0.9rem; }
            .card-meta { font-size: 0.72rem; }
        }

        .card-strip {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            gap: 12px;
            padding: 14px 16px;
            overflow-x: auto;
            background: linear-gradient(to top, rgba(22,36,31,0.35), transparent);
        }

        .card-strip::-webkit-scrollbar { height: 6px; }
        .card-strip::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 3px; }

        .resto-card {
            flex: 0 0 auto;
            width: 190px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(22,36,31,0.22);
            padding: 12px;
            cursor: pointer;
            border: 1px solid var(--sand-2);
            transition: transform 0.12s;
        }

        .resto-card:hover { transform: translateY(-3px); }

        .card-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            margin-bottom: 8px;
            color: var(--white);
        }

        .card-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .card-meta { font-size: 0.76rem; color: #5A5347; }

        .leaflet-popup-content-wrapper { border-radius: 12px; }

        .leaflet-popup-content {
            font-family: 'Inter', sans-serif;
            font-size: 0.86rem;
            line-height: 1.45;
            color: var(--ink);
            margin: 12px 14px;
        }

        .popup-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 4px;
        }

        .popup-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            color: var(--white);
            margin-bottom: 6px;
        }

        .popup-link {
            display: inline-block;
            margin-top: 8px;
            background: var(--paprika);
            color: var(--white) !important;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none !important;
            font-size: 0.82rem;
            font-weight: 600;
        }

        @media (max-width: 680px) {
            main { padding: 20px 14px 50px; }
            .resto-header h1 { font-size: 1.35rem; }
            .infos { flex-direction: column; gap: 6px; }
            .plat { flex-direction: column; align-items: flex-start; gap: 4px; }
            .prix { align-self: flex-end; }
        }
    </style>

</head>

<body>

    <header>
        <div class="brand">Restaurants de <span>Dakar</span> — Suivi en temps réel</div>

        {% if user.is_authenticated %}
            <div class="auth-box">
                <span>👤 {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn-logout">Se déconnecter</button>
                </form>
            </div>
        {% else %}
            <div class="auth-box">
                <a href="{% url 'login' %}">Se connecter</a>
                <span>|</span>
                <a href="{% url 'signup' %}">S'inscrire</a>
            </div>
        {% endif %}
    </header>
{% if messages %}
<div id="flashMessages" style="position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 2000;">
    {% for message in messages %}
    <div style="background: #1F6E5C; color: #FFFDF8; padding: 10px 20px; border-radius: 8px; margin-bottom: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); font-family: 'Inter', sans-serif; font-size: 0.9rem;">
        ✅ {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}

    <div class="map-wrapper">

        <button class="panel-toggle" id="panelToggle">🔍</button>

        <div class="control-panel">
            <h3>Rechercher un restaurant</h3>
            <input type="text" id="searchInput" placeholder="Nom du restaurant...">
            <select id="categorieSelect">
                <option value="">Toutes catégories</option>
                <option value="Sénégalais">Sénégalais</option>
                <option value="Fruits de mer">Fruits de mer</option>
                <option value="Gastronomique">Gastronomique</option>
                <option value="Grillades">Grillades</option>
                <option value="Café">Café</option>
                <option value="Italien">Italien</option>
                <option value="Street food">Street food</option>
            </select>

            <div class="btn-row">
                <button id="searchBtn" class="btn-primary">Rechercher</button>
                <button id="resetBtn" class="btn-secondary">Réinitialiser</button>
            </div>
            <div class="btn-row">
                <button id="nearMeBtn" class="btn-accent">📍 Autour de moi</button>
            </div>
            <div class="btn-row">
                <button id="trackBtn" class="btn-track">▶️ Suivi</button>
                <button id="stopTrackBtn" class="btn-stop" disabled>⏹️ Stop</button>
            </div>
        </div>

        <div id="mapid"></div>

        <div class="card-strip" id="cardStrip"></div>

    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        var controlPanel = document.querySelector('.control-panel');
        var panelToggle = document.getElementById('panelToggle');
        if (window.innerWidth > 680) {
            controlPanel.classList.add('open');
        }
        panelToggle.addEventListener('click', function () {
            controlPanel.classList.toggle('open');
        });

        var mymap = L.map('mapid').setView([14.6928, -17.4441], 12);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 19
        }).addTo(mymap);

        L.marker([14.6928, -17.4441]).addTo(mymap).bindPopup("Dakar").openPopup();

        var categoryColors = {
            'Sénégalais': '#BF4E26',
            'Fruits de mer': '#1F6E5C',
            'Gastronomique': '#16241F',
            'Grillades': '#8C3226',
            'Café': '#6B4226',
            'Italien': '#E3A72E',
            'Street food': '#2F5233'
        };
        function tagColor(cat) { return categoryColors[cat] || '#5A5347'; }

        fetch('/tracking/points_data/')
            .then(r => r.json())
            .then(data => {
                L.geoJSON(data, {
                    onEachFeature: function (feature, layer) {
                        if (feature.properties && feature.properties.name) {
                            layer.bindPopup(feature.properties.name);
                        }
                    }
                }).addTo(mymap);
            });

        fetch('/tracking/zones_data/')
            .then(r => r.json())
            .then(data => {
                L.geoJSON(data, {
                    style: () => ({ color: "#1F6E5C", weight: 3, opacity: 0.5, fillOpacity: 0.15 }),
                    onEachFeature: function (feature, layer) {
                        if (feature.properties && feature.properties.name) {
                            layer.bindPopup(feature.properties.name);
                        }
                    }
                }).addTo(mymap);
            });

        fetch('/tracking/routes_data/')
            .then(r => r.json())
            .then(data => {
                L.geoJSON(data, {
                    style: () => ({ color: "#BF4E26", weight: 4, opacity: 0.7 }),
                    onEachFeature: function (feature, layer) {
                        if (feature.properties && feature.properties.name) {
                            layer.bindPopup(feature.properties.name);
                        }
                    }
                }).addTo(mymap);
            });

        var restaurantIcon = L.icon({
            iconUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-icon.png',
            shadowUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34]
        });

        var restaurantLayer = L.layerGroup().addTo(mymap);
        var markersById = {};
        var cardStrip = document.getElementById('cardStrip');

        function buildPopup(props) {
            let html = `<span class="popup-tag" style="background:${tagColor(props.categorie)}">${props.categorie || ''}</span><br>`;
            html += `<div class="popup-title">${props.nom}</div>`;
            if (props.description) html += `${props.description}<br>`;
            html += `📍 ${props.adresse}<br>`;
            if (props.telephone) html += `📞 ${props.telephone}<br>`;
            if (props.horaires) html += `🕒 ${props.horaires}<br>`;
            if (props.distance_km !== undefined) html += `📏 ${props.distance_km} km<br>`;
            html += `<a class="popup-link" href="/tracking/restaurant/${props._id}/">Voir le menu</a>`;
            return html;
        }

        function renderCardStrip(features) {
            cardStrip.innerHTML = '';
            features.forEach(function (f) {
                const p = f.properties;
                const card = document.createElement('div');
                card.className = 'resto-card';
                card.innerHTML = `
                    <span class="card-tag" style="background:${tagColor(p.categorie)}">${p.categorie || ''}</span>
                    <div class="card-name">${p.nom}</div>
                    <div class="card-meta">${p.adresse}${p.distance_km !== undefined ? ' · ' + p.distance_km + ' km' : ''}</div>
                `;
                card.addEventListener('click', function () {
                    const coords = f.geometry.coordinates;
                    mymap.flyTo([coords[1], coords[0]], 15);
                    if (markersById[f.id]) markersById[f.id].openPopup();
                });
                cardStrip.appendChild(card);
            });
        }

        function loadRestaurants(query) {
            restaurantLayer.clearLayers();
            markersById = {};
            var url = '/tracking/restaurants_data/' + (query ? '?' + query : '');
            fetch(url)
                .then(r => r.json())
                .then(data => {
                    L.geoJSON(data, {
                        pointToLayer: (feature, latlng) => L.marker(latlng, { icon: restaurantIcon }),
                        onEachFeature: function (feature, layer) {
                            feature.properties._id = feature.id;
                            layer.bindPopup(buildPopup(feature.properties));
                            markersById[feature.id] = layer;

                            layer.on('click', function () {
                                const coords = feature.geometry.coordinates;
                                selectedRestaurant = { lat: coords[1], lon: coords[0], nom: feature.properties.nom };
                                updateItineraryLine();
                            });
                        }
                    }).addTo(restaurantLayer);
                    renderCardStrip(data.features);
                });
        }

        loadRestaurants();

        document.getElementById('searchBtn').addEventListener('click', function () {
            const q = document.getElementById('searchInput').value;
            const categorie = document.getElementById('categorieSelect').value;
            const params = new URLSearchParams();
            if (q) params.append('q', q);
            if (categorie) params.append('categorie', categorie);
            loadRestaurants(params.toString());
        });

        document.getElementById('resetBtn').addEventListener('click', function () {
            document.getElementById('searchInput').value = '';
            document.getElementById('categorieSelect').value = '';
            loadRestaurants();
        });

        document.getElementById('nearMeBtn').addEventListener('click', function () {
            if (!navigator.geolocation) { alert("Géolocalisation non supportée."); return; }
            navigator.geolocation.getCurrentPosition(function (position) {
                const lat = position.coords.latitude, lon = position.coords.longitude;
                mymap.setView([lat, lon], 14);
                L.marker([lat, lon]).addTo(mymap).bindPopup("Vous êtes ici").openPopup();
                const params = new URLSearchParams();
                params.append('lat', lat); params.append('lon', lon); params.append('rayon', 5);
                loadRestaurants(params.toString());
            }, function (error) {
                alert("Impossible de récupérer votre position : " + error.message);
            });
        });

        var userMarker = null, watchId = null;
        var userIcon = L.icon({
            iconUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-icon-2x.png',
            shadowUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-shadow.png',
            iconSize: [30, 49], iconAnchor: [15, 49]
        });

        function updateUserPosition(lat, lon) {
            if (userMarker) userMarker.setLatLng([lat, lon]);
            else userMarker = L.marker([lat, lon], { icon: userIcon }).addTo(mymap).bindPopup("Votre position actuelle");
        }

        document.getElementById('trackBtn').addEventListener('click', function () {
            if (!navigator.geolocation) { alert("Géolocalisation non supportée."); return; }

            document.getElementById('trackBtn').disabled = true;
            document.getElementById('stopTrackBtn').disabled = false;
            document.getElementById('trackBtn').textContent = '📡 Localisation...';

            navigator.geolocation.getCurrentPosition(function (position) {
                updateUserPosition(position.coords.latitude, position.coords.longitude);
                updateItineraryLine();
                document.getElementById('trackBtn').textContent = '▶️ Suivi';
            }, function () {}, { enableHighAccuracy: false, timeout: 5000 });

            watchId = navigator.geolocation.watchPosition(function (position) {
                const lat = position.coords.latitude, lon = position.coords.longitude;
                updateUserPosition(lat, lon);
                mymap.setView([lat, lon], mymap.getZoom());
                updateItineraryLine();
                document.getElementById('trackBtn').textContent = '▶️ Suivi';
            }, function (error) {
                alert("Erreur de géolocalisation - Code: " + error.code);
            }, { enableHighAccuracy: true, maximumAge: 0 });
        });

        document.getElementById('stopTrackBtn').addEventListener('click', function () {
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            if (itineraryLine) {
                mymap.removeLayer(itineraryLine);
                itineraryLine = null;
            }
            document.getElementById('trackBtn').disabled = false;
            document.getElementById('stopTrackBtn').disabled = true;
        });

        setTimeout(function () {
            const fm = document.getElementById('flashMessages');
            if (fm) { fm.style.transition = 'opacity 0.5s'; fm.style.opacity = '0'; }
            setTimeout(function () { if (fm) fm.remove(); }, 500);
        }, 4000);

        var selectedRestaurant = null;
        var itineraryLine = null;

        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function updateItineraryLine() {
            if (!userMarker || !selectedRestaurant) return;

            if (itineraryLine) {
                mymap.removeLayer(itineraryLine);
            }
            const userPos = userMarker.getLatLng();
            const destPos = L.latLng(selectedRestaurant.lat, selectedRestaurant.lon);
            const distance = haversine(userPos.lat, userPos.lng, selectedRestaurant.lat, selectedRestaurant.lon);

            itineraryLine = L.polyline([userPos, destPos], {
                color: '#BF4E26', weight: 4, dashArray: '8,8'
            }).addTo(mymap);

            itineraryLine.bindTooltip(
                `🧭 ${selectedRestaurant.nom} — ${distance.toFixed(2)} km`,
                { permanent: true, direction: 'center', className: 'itineraire-tooltip' }
            );
        }
    });
    </script>

</body>
</html>
